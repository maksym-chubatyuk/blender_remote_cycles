schema_version = "1.0.0"

id = "remote_cycles"
version = "1.0.0"
name = "Remote Cycles"
tagline = "A LAN render cluster: use other machines' GPUs for Cycles"
maintainer = "maksym-chubatyuk"
type = "add-on"
website = "https://github.com/maksym-chubatyuk/blender_remote_cycles"

blender_version_min = "5.2.0"

license = ["SPDX:GPL-3.0-or-later"]

[permissions]
network = "Stream scenes to, and renders from, a render server"
files = "Write temporary scene snapshots for upload"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".*",
  "*.sh",
  "tests/",
  "dist/",
]
